services:
  postgres:
    image: postgres:16-alpine
    container_name: restaurante-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-restaurante}
      POSTGRES_USER: ${POSTGRES_USER:-restaurante}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-restaurante}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./restaurante-backend
    container_name: restaurante-backend
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-restaurante}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-restaurante}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-restaurante}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-local-development-secret-key-with-at-least-64-characters-change-me}
      APP_JWT_EXPIRATION_IN_MS: ${APP_JWT_EXPIRATION_IN_MS:-86400000}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}

  frontend:
    build:
      context: ./restaurante-frontend
      args:
        BACKEND_INTERNAL_URL: http://backend:8080
        NEXT_PUBLIC_BACKEND_URL: http://localhost:8080
    container_name: restaurante-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      BACKEND_INTERNAL_URL: http://backend:8080
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8080

volumes:
  postgres-data:
