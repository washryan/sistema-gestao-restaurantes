services:
  - type: web
    name: restaurante-backend
    runtime: docker
    plan: starter
    region: oregon
    rootDir: restaurante-backend
    dockerfilePath: restaurante-backend/Dockerfile
    dockerContext: restaurante-backend
    healthCheckPath: /api/menu
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: restaurante-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: restaurante-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: restaurante-db
          property: password
      - key: APP_JWT_SECRET
        generateValue: true
      - key: APP_JWT_EXPIRATION_IN_MS
        value: "86400000"

databases:
  - name: restaurante-db
    plan: free
    region: oregon
    databaseName: restaurante
