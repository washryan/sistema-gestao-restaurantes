spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
server.port=8080
spring.application.name=restaurante-backend
app.jwtSecret=${APP_JWT_SECRET:local-development-secret-key-with-at-least-64-characters-change-me}
app.jwtExpirationInMs=${APP_JWT_EXPIRATION_IN_MS:86400000}

# Para debug:
logging.level.org.springframework=INFO
logging.level.com.restaurante=DEBUG
